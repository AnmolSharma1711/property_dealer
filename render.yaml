services:
  # PostgreSQL Database
  - type: pserv
    name: broker-db
    plan: starter
    region: ohio

  # Django Backend
  - type: web
    name: broker-backend
    runtime: python
    region: ohio
    plan: starter
    repo: https://github.com/AnmolSharma1711/property_dealer.git
    branch: main
    buildCommand: pip install -r backend/requirements.txt && cd backend/core && python manage.py migrate && python manage.py collectstatic --noinput && python create_admin.py
    startCommand: cd backend/core && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: DATABASE_URL
        fromDatabase:
          name: broker-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

  # React Frontend - Static Site
  - type: web
    name: broker-frontend
    runtime: static
    region: ohio
    plan: starter
    repo: https://github.com/AnmolSharma1711/property_dealer.git
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://broker-backend.onrender.com/api

  # Celery Worker - Cron Job
  - type: cron
    name: broker-celery-worker
    runtime: python
    plan: starter
    region: ohio
    repo: https://github.com/AnmolSharma1711/property_dealer.git
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/core && celery -A core worker -l info --concurrency=1 -t 300
    schedule: "*/15 * * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: DATABASE_URL
        fromDatabase:
          name: broker-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

# ✅ Celery worker now runs via Render Cron Job (more reliable)
# - Automatic scheduling on Render infrastructure
# - Data persists with PostgreSQL (broker-db)
# 
# ⚠️  IMPORTANT: After Blueprint deployment:
# 1. Add persistent disk to backend manually via Render Dashboard
#    - Go to broker-backend → Settings → Disks
#    - Create disk: name=broker-data, mount=/var/data, size=5GB
# 2. Set environment variables that reference external services:
#    - REDIS_URL: your Redis connection string
#    - GROQ_API_KEY: your API key
#    - SERPAPI_API_KEY: your API key
