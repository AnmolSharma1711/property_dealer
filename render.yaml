services:
  # Django Backend
  - type: web
    name: broker-backend
    runtime: python
    region: ohio
    plan: starter
    repo: https://github.com/AnmolSharma1711/property_dealer.git
    branch: main
    buildCommand: pip install -r backend/requirements.txt && cd backend/core && python manage.py migrate && python manage.py collectstatic --noinput && python create_admin.py
    startCommand: cd backend/core && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"

  # React Frontend (Static)
  - type: web
    name: broker-frontend
    runtime: static
    plan: starter
    repo: https://github.com/AnmolSharma1711/property_dealer.git
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

  # Celery Worker - Cron Job (Every 15 minutes)
  - type: cron
    name: broker-celery-worker
    runtime: python
    region: ohio
    plan: starter
    repo: https://github.com/AnmolSharma1711/property_dealer.git
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/core && celery -A core worker -l info --concurrency=1 -t 300
    schedule: "*/15 * * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
